<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Blitz Quiz</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --btn-hover: #0ea5e9;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            margin: 1rem;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-weight: bold;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .question-box {
            font-size: 2rem;
            margin: 1.5rem 0;
            font-weight: bold;
            letter-spacing: 2px;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            font-size: 1.25rem;
            border: 2px solid #334155;
            border-radius: 0.5rem;
            background-color: #0f172a;
            color: white;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        .hidden {
            display: none;
        }

        #feedback {
            margin-top: 1rem;
            font-weight: bold;
            min-height: 1.5rem;
        }

        .correct { color: var(--success); }
        .wrong { color: var(--error); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>Math Blitz</h1>
            <p class="subtitle">Test your arithmetic speed!</p>
            <button id="start-btn">Start Game</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <h1>Math Blitz</h1>
            <div class="stats">
                <span id="score-display">Score: 0</span>
                <span id="timer-display">Time: 30s</span>
            </div>
            <div class="question-box" id="question-text">5 + 3</div>
            <form id="answer-form">
                <input type="number" id="answer-input" placeholder="Enter answer" autocomplete="off" required>
                <button type="submit">Submit</button>
            </form>
            <div id="feedback"></div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden">
            <h1>Game Over!</h1>
            <p class="subtitle">Great effort!</p>
            <p style="font-size: 1.2rem; margin: 1.5rem 0;">Your Final Score: <span id="final-score" style="font-weight: bold; color: var(--accent-color);">0</span></p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const answerForm = document.getElementById('answer-form');
        const answerInput = document.getElementById('answer-input');
        
        const questionText = document.getElementById('question-text');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const feedback = document.getElementById('feedback');

        let score = 0;
        let timeLeft = 30;
        let timer = null;
        let currentAnswer = 0;

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = `Score: ${score}`;
            timerDisplay.textContent = `Time: ${timeLeft}s`;
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            answerInput.value = '';
            feedback.textContent = '';
            
            generateQuestion();
            answerInput.focus();

            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `Time: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    endGame();
                }
            }, 1000);
        }

        function generateQuestion() {
            const ops = ['+', '-', '*'];
            const op = ops[Math.floor(Math.random() * ops.length)];
            let num1 = Math.floor(Math.random() * 12) + 1;
            let num2 = Math.floor(Math.random() * 12) + 1;

            // Prevent negative results for basic subtraction simplicity
            if (op === '-' && num1 < num2) {
                let temp = num1;
                num1 = num2;
                num2 = temp;
            }

            currentAnswer = eval(`${num1} ${op} ${num2}`);
            questionText.textContent = `${num1} ${op === '*' ? '×' : op} ${num2}`;
        }

        answerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userAnswer = parseInt(answerInput.value);

            if (userAnswer === currentAnswer) {
                score += 10;
                feedback.textContent = "Correct! +10";
                feedback.className = "correct";
            } else {
                score = Math.max(0, score - 5);
                feedback.textContent = `Wrong! Answer was ${currentAnswer}`;
                feedback.className = "wrong";
            }

            scoreDisplay.textContent = `Score: ${score}`;
            answerInput.value = '';
            generateQuestion();
        });

        function endGame() {
            gameScreen.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScoreDisplay.textContent = score;
        }
    </script>
</body>
</html>
